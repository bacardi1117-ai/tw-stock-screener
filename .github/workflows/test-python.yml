name: Test Python environment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check environment
        run: python src/main.py
      - name: Python strategy and data tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Browser logic tests
        run: node --test tests/test_frontend.mjs tests/test_backtest.mjs tests/test_backtest_defaults.mjs tests/test_eps_value_engine.mjs
