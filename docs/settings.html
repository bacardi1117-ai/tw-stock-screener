<main><section class="hero settings-hero"><div><p class="eyebrow">CONTROL ROOM</p><h1>讓規則符合你的研究方式。</h1><p>調整數值或啟用條件，符合數會即時更新。自訂設定只保存在此瀏覽器。</p></div></section>

<div id="settingsSections"></div><p class="footnote">調整最低股價至已下載範圍以下，或納入已排除的金融股時，相關基本面可能不完整，需重新執行資料更新才能完整套用。匯入與匯出只在本機瀏覽器進行。</p></main>
